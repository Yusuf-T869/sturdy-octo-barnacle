# Azure DevOps Pipeline to upload statefile and manage Snowflake private key (Windows)

trigger:
  branches:
    include:
      - file-upload

variables:
  - group: snowflake-credentials
  
  - name: terraformVersion
    value: '1.14.6'

  - name: azureServiceConnection
    value: 'tf-ci/cd'
  
  - name: ARM_USE_OIDC
    value: true
  - name: ARM_USE_AZUREAD
    value: true

  - name: keyVaultName
    value: 'newkvx1'
  - name: keyVaultSecretName
    value: 'snowflake-private-key'


stages:
  - stage: upload_private_key
    displayName: 'Upload Private Key to Key Vault'
    jobs:
      - job: upload_key
        displayName: 'Upload Snowflake Private Key'
        pool:
          vmImage: 'windows-latest'
        steps:
          - checkout: none

          - task: AzureCLI@2
            displayName: 'Upload Private Key to Key Vault'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: ps
              scriptLocation: inlineScript
              inlineScript: |
                Write-Host "Authenticating to Azure..."
                az account show
                
                Write-Host "Uploading Snowflake private key to Key Vault: $(keyVaultName)"
                
                az keyvault secret set `
                  --vault-name "$(keyVaultName)" `
                  --name "$(keyVaultSecretName)" `
                  --value "$(SNOWFLAKE_PRIVATE_KEY)" `
                  --content-type "application/x-pem-file" `
                  --description "Snowflake RSA private key for Terraform authentication"
                
                Write-Host "Private key uploaded successfully!"
            env:
              ARM_USE_OIDC: true
              ARM_USE_AZUREAD: true

  - stage: file_upload
    displayName: 'File Upload'
    jobs:
      - job: file_upload
        displayName: 'Run File Upload'
        pool:
          vmImage: 'windows-latest'
        steps:
          - checkout: self
            persistCredentials: true

          - task: AzureCLI@2
            displayName: 'Azure Login (OIDC) and Upload state file'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: ps
              scriptLocation: inlineScript
              inlineScript: |
                Write-Host "Authenticated via OIDC"
                az account show
                az storage blob upload --container-name $(TF_STATE_CONTAINER) --name terraform.tfstate --file terraform.tfstate --account-name $(TF_STATE_STORAGE) --auth-mode login
                az storage blob list --container-name $(TF_STATE_CONTAINER) --account-name $(TF_STATE_STORAGE) --output table --auth-mode login
            env:
              ARM_USE_OIDC: true
              ARM_USE_AZUREAD: true
