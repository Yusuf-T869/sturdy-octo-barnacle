trigger:
  branches:
    include:
      - main # Triggers automatically when code is merged to main

# Link the secure variables we just created
variables:
  - group: snowflake-dbt

schedules:
  - cron: "0 */4 * * *"
    displayName: Production dbt Build every 4 hours
    branches:
      include:
        - finxact_infrastructure_dev

pool:
  vmImage: "ubuntu-latest"

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: "3.11"
    displayName: "Use Python 3.11"

  - script: |
      python -m pip install --upgrade pip
      pip install dbt-snowflake
    displayName: "Install dbt and Snowflake adapter"

  - script: |
      mkdir -p ~/.dbt
      cat << 'EOF' > ~/.dbt/profiles.yml
      finxact:
        target: prod
        outputs:
          prod:
            type: snowflake
            account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
            user: "{{ env_var('SNOWFLAKE_USER') }}"
            password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
            role: "{{ env_var('SNOWFLAKE_ROLE') }}"
            database: FINXACT_DATA_STORE
            warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
            schema: FINXACT_OPERATIONAL_DATA_STORE
            threads: 4
            client_session_keep_alive: False
      EOF
    displayName: "Dynamically generate profiles.yml"

  - script: |
      echo "=== Current directory ==="
      pwd
      echo "=== List root ==="
      ls -R .
    displayName: "Debug repo structure"

  - script: |
      dbt deps
    workingDirectory: "finxact"
    displayName: "dbt deps (Install Packages)"
    env:
      SNOWFLAKE_ACCOUNT: $(SNOWFLAKE_ACCOUNT)
      SNOWFLAKE_USER: $(SNOWFLAKE_USER)
      SNOWFLAKE_PASSWORD: $(SNOWFLAKE_PASSWORD)
      SNOWFLAKE_ROLE: $(SNOWFLAKE_ROLE)
      SNOWFLAKE_WAREHOUSE: $(SNOWFLAKE_WAREHOUSE)

  - script: |
      dbt seed --target prod
    workingDirectory: "finxact"
    displayName: "dbt seed (Load Static Data)"
    env:
      SNOWFLAKE_ACCOUNT: $(SNOWFLAKE_ACCOUNT)
      SNOWFLAKE_USER: $(SNOWFLAKE_USER)
      SNOWFLAKE_PASSWORD: $(SNOWFLAKE_PASSWORD)
      SNOWFLAKE_ROLE: $(SNOWFLAKE_ROLE)
      SNOWFLAKE_WAREHOUSE: $(SNOWFLAKE_WAREHOUSE)

  - script: |
      dbt run --target prod
    workingDirectory: "finxact"
    displayName: "dbt run (Build Models)"
    env:
      SNOWFLAKE_ACCOUNT: $(SNOWFLAKE_ACCOUNT)
      SNOWFLAKE_USER: $(SNOWFLAKE_USER)
      SNOWFLAKE_PASSWORD: $(SNOWFLAKE_PASSWORD)
      SNOWFLAKE_ROLE: $(SNOWFLAKE_ROLE)
      SNOWFLAKE_WAREHOUSE: $(SNOWFLAKE_WAREHOUSE)

  - script: |
      dbt test --target prod
    displayName: "dbt test (Run Data Quality Checks)"
    workingDirectory: "finxact"
    env:
      SNOWFLAKE_ACCOUNT: $(SNOWFLAKE_ACCOUNT)
      SNOWFLAKE_USER: $(SNOWFLAKE_USER)
      SNOWFLAKE_PASSWORD: $(SNOWFLAKE_PASSWORD)
      SNOWFLAKE_ROLE: $(SNOWFLAKE_ROLE)
      SNOWFLAKE_WAREHOUSE: $(SNOWFLAKE_WAREHOUSE)

  - script: |
      dbt docs generate --target prod
    workingDirectory: "finxact"
    displayName: "dbt docs (Generate Documentation)"
    env:
      SNOWFLAKE_ACCOUNT: $(SNOWFLAKE_ACCOUNT)
      SNOWFLAKE_USER: $(SNOWFLAKE_USER)
      SNOWFLAKE_PASSWORD: $(SNOWFLAKE_PASSWORD)
      SNOWFLAKE_ROLE: $(SNOWFLAKE_ROLE)
      SNOWFLAKE_WAREHOUSE: $(SNOWFLAKE_WAREHOUSE)

  - publish: "finxact/target/"
    artifact: "dbt-documentation"
    displayName: "Publish dbt Docs as Pipeline Artifact"
